<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>BlueXky</title>
  <style>
    body { width: 280px; margin: 0; padding: 14px; font: 14px/1.4 system-ui, sans-serif; color: #0f1419; }
    h1 { margin: 0 0 10px; font-size: 16px; }
    label { display: block; margin-bottom: 8px; font-size: 12px; color: #536471; }
    input { display: block; width: 100%; box-sizing: border-box; margin-top: 3px; padding: 7px 8px; border: 1px solid #cfd9de; border-radius: 6px; font: inherit; color: #0f1419; }
    button { width: 100%; padding: 8px; border: 0; border-radius: 9999px; font: inherit; font-weight: 700; color: #fff; background: #0a7aff; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: default; }
    #status { margin: 10px 0 0; min-height: 18px; font-size: 13px; }
    #status.error { color: #d4183d; }
    .warn { margin: -2px 0 10px; font-size: 12px; font-weight: 700; color: #b45309; }
    .hint { margin: 10px 0 0; font-size: 12px; color: #536471; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <h1>BlueXky</h1>

  <form id="login" hidden>
    <label>Username
      <input id="identifier" autocomplete="username" placeholder="username (or full handle)" required>
    </label>
    <label>App Password
      <input id="password" type="password" autocomplete="off" placeholder="xxxx-xxxx-xxxx-xxxx" required>
    </label>
    <p class="warn">This is not your Bluesky password.</p>
    <button type="submit">Log in</button>
    <p class="hint">Create an App Password in Bluesky → Settings → Privacy and security → App passwords. It is used once to create a session and is not stored.</p>
  </form>

  <div id="account" hidden>
    <p>Logged in as <strong id="handle"></strong></p>
    <button id="logout" type="button">Log out</button>
  </div>

  <p id="status"></p>
  <script src="popup.js"></script>
</body>
</html>
